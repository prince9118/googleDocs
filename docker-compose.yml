services:
  postgres:
    image: postgres:17
    container_name: google-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docs_user
      POSTGRES_PASSWORD: docs_password
      POSTGRES_DB: google_docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: